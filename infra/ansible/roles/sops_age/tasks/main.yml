---
# ==============================================================================
# Role: sops_age (Distribute Age Private Key for KSOPS / In-Cluster Decryption)
# ==============================================================================

- name: Check that age private key exists on dev machine
  ansible.builtin.stat:
    path: "{{ sops_age_key_local_path }}"
  delegate_to: localhost
  become: false
  register: sops_age_key_local
  run_once: true

- name: Assert age private key is available locally
  ansible.builtin.assert:
    that: sops_age_key_local.stat.exists
    fail_msg: >-
      Age private key not found at {{ sops_age_key_local_path }}.
      Please ensure your Age key is available on the local machine.
  run_once: true

- name: Create remote directory for SOPS age key
  ansible.builtin.file:
    path: "{{ sops_age_key_remote_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy age private key to remote server
  ansible.builtin.copy:
    src: "{{ sops_age_key_local_path }}"
    dest: "{{ sops_age_key_remote_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
