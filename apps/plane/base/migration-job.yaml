apiVersion: batch/v1
kind: Job
metadata:
  name: plane-ce-api-migrate
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/component: migrator
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane
        app.kubernetes.io/component: migrator
    spec:
      serviceAccountName: plane-ce-srv-account
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 plane-ce-pgdb 5432; do
                echo "Waiting for PostgreSQL database on port 5432...";
                sleep 2;
              done
      containers:
        - name: plane-ce-api-migrate
          image: artifacts.plane.so/makeplane/plane-backend:v1.4.2
          imagePullPolicy: IfNotPresent
          command:
            - ./bin/docker-entrypoint-migrator.sh
          envFrom:
            - configMapRef:
                name: plane-ce-app-vars
            - secretRef:
                name: plane-ce-app-secrets
            - secretRef:
                name: plane-ce-doc-store-secrets
