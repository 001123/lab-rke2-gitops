apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-ce-app-vars
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane-ce
data:
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: ""
  DEBUG: "0"
  DOCKERIZED: "1"
  GUNICORN_WORKERS: "2"
  MINIO_ENDPOINT_SSL: "0"
  API_KEY_RATE_LIMIT: "120/minute"
  ENABLE_DRF_SPECTACULAR: "0"
  WEB_URL: "http://plane.example.com"
  CORS_ALLOWED_ORIGINS: "http://plane.example.com,https://plane.example.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-ce-live-vars
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane-ce
data:
  API_BASE_URL: "http://plane-ce-api:8000/"
  LIVE_BASE_PATH: "/live"
