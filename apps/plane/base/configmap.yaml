apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-ce-app-vars
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane-ce
data:
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: ""
  DEBUG: "0"
  DOCKERIZED: "1"
  GUNICORN_WORKERS: "2"
  MINIO_ENDPOINT_SSL: "0"
  API_KEY_RATE_LIMIT: "120/minute"
  ENABLE_DRF_SPECTACULAR: "0"
  WEB_URL: "http://plane.example.com"
  CORS_ALLOWED_ORIGINS: "http://plane.example.com,https://plane.example.com"
  ADMIN_BASE_URL: "http://plane.example.com/god-mode/"
  ADMIN_BASE_PATH: "/god-mode/"
  SPACE_BASE_URL: "http://plane.example.com/spaces/"
  SPACE_BASE_PATH: "/spaces/"
  APP_BASE_URL: "http://plane.example.com/"
  APP_BASE_PATH: "/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-ce-live-vars
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane-ce
data:
  API_BASE_URL: "http://plane-ce-api:8000/"
  LIVE_BASE_PATH: "/live"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-ce-admin-nginx-conf
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane-ce
data:
  nginx.conf: |
    worker_processes 4;

    events {
      worker_connections 1024;
    }

    http {
      include mime.types;

      default_type  application/octet-stream;

      set_real_ip_from        0.0.0.0/0;
      real_ip_recursive       on;
      real_ip_header          X-Forwarded-For;
      limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

      access_log /dev/stdout;
      error_log /dev/stderr;

      server {
        listen 3000;

        port_in_redirect off;
        absolute_redirect off;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
          try_files $uri $uri/ /god-mode/index.html;
        }
      }
    }
---
