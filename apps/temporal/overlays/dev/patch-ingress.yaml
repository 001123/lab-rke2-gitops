apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui
spec:
  rules:
    - host: dev-temporal.192.168.250.215.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: 8080
    - host: dev-temporal.192.168.250.215.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: 8080
  tls:
    - hosts:
        - dev-temporal.192.168.250.215.nip.io
        - dev-temporal.192.168.250.215.sslip.io
      secretName: dev-temporal-tls
