apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: grpc-rpc
      port: 7233
      targetPort: 7233
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: server
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: grpc-rpc
      port: 7233
      targetPort: 7233
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: temporal-server
          image: temporalio/server:1.32.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc-rpc
              containerPort: 7233
            - name: metrics
              containerPort: 9090
            - name: ringpop-fe
              containerPort: 6933
            - name: ringpop-hist
              containerPort: 6934
            - name: ringpop-match
              containerPort: 6935
            - name: ringpop-work
              containerPort: 6939
          env:
            - name: AUTO_SETUP
              value: "true"
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: "temporal-postgresql"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: POSTGRES_PASSWORD
            - name: DBNAME
              value: "temporal"
            - name: VISIBILITY_DBNAME
              value: "temporal_visibility"
            - name: DEFAULT_NAMESPACE
              value: "default"
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: TEMPORAL_ADDRESS
              value: "temporal-frontend:7233"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "config/dynamicconfig/development-cluster.yaml"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 35
            periodSeconds: 20
            timeoutSeconds: 5
