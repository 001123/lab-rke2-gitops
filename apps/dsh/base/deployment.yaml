apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  labels:
    app.kubernetes.io/name: dsh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh
    spec:
      containers:
        - name: dsh
          image: registry.192.168.250.215.nip.io/dsh:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3080
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3080"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsh-secret
                  key: DEEPSEEK_API_KEY
          volumeMounts:
            - name: storage
              mountPath: /root/.dsh
              subPath: dsh-config
            - name: storage
              mountPath: /workspace
              subPath: workspace
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: dsh-storage
