apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  labels:
    app.kubernetes.io/name: dsh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh
    spec:
      containers:
        - name: dsh
          image: registry.192.168.250.215.sslip.io/dsh:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3080
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /root/.dsh
              subPath: dsh-config
            - name: storage
              mountPath: /workspace
              subPath: workspace
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=6144"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: dsh-storage
