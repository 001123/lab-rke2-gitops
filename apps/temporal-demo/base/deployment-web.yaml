apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-demo-web
  labels:
    app.kubernetes.io/name: temporal-demo
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-demo
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-demo
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: registry.192.168.250.215.sslip.io/temporal-demo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: TEMPORAL_ADDRESS
              value: "temporal-frontend.temporal-dev.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_WEB_URL
              value: "https://dev-temporal.192.168.250.215.nip.io"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
