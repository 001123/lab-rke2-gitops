apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-demo-web
spec:
  rules:
    - host: dev-temporal-demo.192.168.250.215.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-demo-web
                port:
                  number: 3000
    - host: dev-temporal-demo.192.168.250.215.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-demo-web
                port:
                  number: 3000
  tls:
    - hosts:
        - dev-temporal-demo.192.168.250.215.nip.io
        - dev-temporal-demo.192.168.250.215.sslip.io
      secretName: dev-temporal-demo-tls
